<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fight Night</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d1c'/%3E%3Cpath d='M14 22c0-8 10-12 20-11 12 1 20 9 20 20s-8 20-20 20H22c-5 0-8-3-8-8z' fill='%23ff7a6b'/%3E%3Crect x='6' y='26' width='12' height='22' rx='4' fill='%23f4f4f4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@500;700&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Concept: a fight poster under arena lights. Khadi is the red corner (coral), Manny the blue corner (sky). Gold is the belt. */
:root{
  --ink:#0b0d1c;--ink2:#141832;--line:#2b3364;--text:#eef0fb;--mute:#9aa2cc;--gold:#ffc857;--gold2:#e7a92c;
  --a:#ff7a6b;--a2:#d9483a;--b:#62c8ff;--b2:#2f8fd0;--cream:#f6efe0;
  --poster:"Anton","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --hand:"Caveat","Bradley Hand",cursive;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.arena{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(60% 46% at 50% -6%,rgba(255,220,150,.30),transparent 70%),
   radial-gradient(40% 50% at 0% 100%,rgba(217,72,58,.20),transparent 70%),
   radial-gradient(40% 50% at 100% 100%,rgba(47,143,208,.22),transparent 70%),
   var(--ink)}
.crowd{position:fixed;left:0;right:0;bottom:0;height:90px;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(14px 16px at 10px 26px,#05060f 60%,transparent 62%),radial-gradient(18px 20px at 34px 22px,#070815 60%,transparent 62%);
  background-size:44px 40px;background-repeat:repeat-x;background-position:bottom;
  -webkit-mask-image:linear-gradient(to top,#000 40%,transparent);mask-image:linear-gradient(to top,#000 40%,transparent)}
.ropes{height:14px;display:grid;gap:3px;padding-top:0}
.ropes i{display:block;height:3px;border-radius:2px}
.ropes i:nth-child(1){background:linear-gradient(90deg,var(--a2),var(--a))}
.ropes i:nth-child(2){background:#e9e4d8}
.ropes i:nth-child(3){background:linear-gradient(90deg,var(--b),var(--b2))}
.wrap{max-width:480px;margin:0 auto;padding:14px 16px 70px;position:relative}
h1,h2,h3{margin:0;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none !important}

/* lobby */
.lob{padding-top:26px;text-align:center}
.bill-top{font-family:var(--mono);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.title{font-family:var(--poster);font-size:clamp(4rem,24vw,6.6rem);line-height:.86;letter-spacing:.01em;margin:8px 0 6px;color:var(--cream);
  text-shadow:4px 4px 0 var(--a2),-4px -4px 0 var(--b2),0 10px 40px rgba(0,0,0,.6);transform:rotate(-2deg)}
.title span{display:block;color:var(--gold)}
.sub-vs{font-family:var(--poster);font-size:1.6rem;letter-spacing:.04em;margin:18px 0 22px;display:flex;justify-content:center;align-items:center;gap:12px}
.sub-vs .a{color:var(--a)} .sub-vs .b{color:var(--b)}
.sub-vs i{font-style:normal;font-size:.8em;color:var(--mute);border:1.5px solid var(--line);border-radius:999px;padding:2px 10px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.whobtn{border:0;border-radius:16px;padding:18px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#14080a;transition:transform .12s}
.whobtn:active{transform:scale(.97)}
.whobtn.a{background:linear-gradient(160deg,var(--a),var(--a2))} .whobtn.b{background:linear-gradient(160deg,var(--b),var(--b2));color:#06131f}
.whobtn small{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.whobtn b{font-family:var(--poster);font-size:1.7rem;font-weight:400;letter-spacing:.03em;line-height:1}
.whobtn svg{width:54px;height:40px}
.err{color:#ff9a94;font-size:.9rem;min-height:1.3em;margin:12px 0 0;text-align:center}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;margin:10px 0 10px}
.wm{font-family:var(--poster);font-size:1.45rem;letter-spacing:.04em;color:var(--cream)} .wm b{color:var(--gold);font-weight:400}
.conn{font-family:var(--mono);font-size:.68rem;color:var(--mute);display:flex;align-items:center;gap:5px}
.conn i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e5645f}
.conn.live i{background:#3fbf8a} .conn.slow i{background:var(--gold)}
.tape{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:rgba(20,24,50,.8);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:10px}
.tape .c{display:flex;flex-direction:column;line-height:1.1}
.tape .c.b{text-align:right}
.tape .c small{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.tape .c b{font-family:var(--poster);font-weight:400;font-size:1.25rem;letter-spacing:.03em}
.tape .c.a b{color:var(--a)} .tape .c.b b{color:var(--b)}
.tape .mid{font-family:var(--mono);font-size:.66rem;color:var(--mute);text-align:center;line-height:1.25}
.tape .mid b{display:block;font-family:var(--poster);font-weight:400;color:var(--gold);font-size:1rem;letter-spacing:.06em}
.pips{display:flex;gap:4px;margin:0 0 12px;align-items:center}
.pips i{flex:1;height:7px;border-radius:4px;background:#252c58;transition:background .4s,transform .3s}
.pips i.gap{flex:0 0 6px;background:none}
.pips i.fight{background:linear-gradient(90deg,var(--a),var(--b))} .pips i.nc{background:#59618f}
.pips i.now{background:var(--gold);transform:scaleY(1.6)}
.pips i.ub{outline:1.5px dashed var(--gold);outline-offset:1px}

/* poster */
.poster{position:relative;border-radius:18px;padding:16px 16px 18px;overflow:hidden;
  background:linear-gradient(165deg,#24121a 0%,#141831 55%,#0f1a2e 100%);border:2px solid rgba(255,200,87,.45);
  box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 6px rgba(0,0,0,.2)}
.poster::before{content:"";position:absolute;left:-40px;top:-40px;width:120px;height:120px;background:var(--a2);opacity:.35;transform:rotate(45deg)}
.poster::after{content:"";position:absolute;right:-40px;bottom:-40px;width:120px;height:120px;background:var(--b2);opacity:.35;transform:rotate(45deg)}
.poster > *{position:relative;z-index:1}
.bill{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.bill .tier{background:var(--gold);color:#1a1205;border-radius:4px;padding:3px 8px;font-weight:500}
.bill .tier.t2{background:linear-gradient(90deg,var(--a),var(--gold),var(--b))}
.bill .tier.ub{background:transparent;color:var(--gold);border:1.5px dashed var(--gold)}
.stmt{font-family:var(--poster);font-weight:400;text-transform:uppercase;color:var(--cream);font-size:clamp(1.7rem,8.2vw,2.35rem);line-height:1.02;letter-spacing:.01em;margin:16px 0 14px;text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.vsrow{display:flex;justify-content:space-between;align-items:center;font-family:var(--poster);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.vsrow .a{color:var(--a)} .vsrow .b{color:var(--b)} .vsrow i{font-style:normal;color:var(--mute);font-size:.85rem}
.poster.anim{animation:drop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes drop{from{transform:translateY(-14px) rotate(-1.5deg);opacity:.3}}

/* action area */
.act{margin-top:12px}
.btn{width:100%;border:0;border-radius:14px;padding:15px 16px;font-family:var(--poster);font-weight:400;letter-spacing:.06em;text-transform:uppercase;font-size:1.25rem;margin-top:10px;transition:transform .08s;background:#262e5c;color:var(--text)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1205}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text);font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:600;font-size:1rem}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.side{border:0;border-radius:16px;padding:20px 8px;font-family:var(--poster);font-size:1.7rem;letter-spacing:.05em;text-transform:uppercase;transition:transform .1s,box-shadow .2s}
.side:active{transform:scale(.96)}
.side.ag{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1205;box-shadow:0 8px 24px rgba(231,169,44,.35)}
.side.dis{background:var(--cream);color:#1a1205;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.side small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;opacity:.65;margin-top:2px}
.chips{display:flex;gap:8px;margin:12px 0 2px;flex-wrap:wrap;justify-content:center}
.chip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:.88rem;font-weight:600;background:rgba(20,24,50,.7);transition:border-color .3s}
.chip .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--poster);font-size:.78rem;color:#14080a}
.chip.a .d{background:var(--a)} .chip.b .d{background:var(--b)}
.chip small{font-family:var(--mono);font-size:.66rem;color:var(--mute);font-weight:400}
.chip.on{border-color:var(--gold)} .chip.on small{color:var(--gold)}
.ref{display:block;margin:14px auto 0;background:none;border:0;color:var(--mute);font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px;padding:6px}
.msg{text-align:center;margin:6px 0 0}
.msg h3{font-family:var(--poster);font-size:1.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--cream);line-height:1}
.msg p{color:var(--mute);margin:6px 0 0;font-size:.95rem}
.sealed{margin:4px auto 0;max-width:260px;border:2px dashed var(--gold);border-radius:14px;padding:12px;text-align:center}
.sealed small{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sealed b{display:block;font-family:var(--poster);font-weight:400;font-size:1.7rem;letter-spacing:.05em;color:var(--gold)}

/* reveal */
.corners{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
.corner{border-radius:16px;padding:12px 8px 12px;text-align:center;color:#14080a;position:relative;overflow:hidden}
.corner.a{background:linear-gradient(160deg,var(--a),var(--a2));animation:inL .5s cubic-bezier(.2,1.2,.4,1) both}
.corner.b{background:linear-gradient(160deg,var(--b),var(--b2));color:#06131f;animation:inR .5s cubic-bezier(.2,1.2,.4,1) both}
@keyframes inL{from{transform:translateX(-60%);opacity:0}} @keyframes inR{from{transform:translateX(60%);opacity:0}}
.corner small{display:block;font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.corner b{display:block;font-family:var(--poster);font-weight:400;font-size:2rem;letter-spacing:.04em;line-height:1.05;margin-top:2px}
.corner em{display:inline-block;font-style:normal;font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;margin-top:6px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.18)}
.verdict{text-align:center;margin:14px 0 4px}
.verdict h3{font-family:var(--poster);font-size:2.4rem;letter-spacing:.04em;line-height:.95;text-transform:uppercase}
.verdict.f h3{color:var(--gold);text-shadow:3px 3px 0 var(--a2),-3px -3px 0 var(--b2)}
.verdict.nc h3{color:#b9bedb}
.verdict p{color:var(--mute);margin:6px 0 0}
.cards4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.res{border:1.5px solid var(--line);background:rgba(20,24,50,.8);border-radius:14px;padding:10px 8px;text-align:center;transition:border-color .2s,background .2s}
.res b{display:block;font-family:var(--poster);font-weight:400;font-size:1.2rem;letter-spacing:.05em;text-transform:uppercase}
.res small{display:block;font-size:.78rem;color:var(--mute);margin-top:2px;line-height:1.2}
.res.ka b{color:var(--a)} .res.kb b{color:var(--b)}
.res.on{border-color:var(--gold);background:rgba(255,200,87,.12)}
.setby{text-align:center;font-family:var(--mono);font-size:.68rem;color:var(--mute);margin-top:8px;min-height:1em}
input.note{width:100%;margin-top:10px;border:1.5px solid var(--line);background:#0f1330;color:var(--text);border-radius:12px;padding:11px 12px;font-family:var(--hand);font-size:1.35rem}
input.note::placeholder{color:#6d75a6}

/* summary */
.card{background:var(--cream);color:#1a1205;border-radius:18px;padding:16px 16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:drop .45s cubic-bezier(.2,1.3,.4,1)}
.card .bill{color:#7a5a12}
.bigline{font-family:var(--poster);font-size:2.6rem;line-height:.95;letter-spacing:.02em;text-transform:uppercase;margin:12px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 6px;text-align:center}
.stats div{background:#fff;border-radius:12px;padding:8px 4px}
.stats b{display:block;font-family:var(--poster);font-weight:400;font-size:1.8rem;line-height:1}
.stats small{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:#6b5f48}
.rl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.rl div{display:flex;gap:8px;align-items:center;background:#fff;border-radius:10px;padding:7px 10px;font-size:.88rem;line-height:1.2}
.rl div i{flex:none;width:10px;height:10px;border-radius:50%;background:#b9bedb}
.rl div.f i{background:linear-gradient(90deg,var(--a),var(--b))}
.rl div em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:.64rem;color:#6b5f48;flex:none}
.belt{margin:14px 0 4px;position:relative;border-radius:14px;padding:12px 14px;text-align:center;color:#1a1205;
  background:linear-gradient(180deg,#ffd877,#e0a12a);border:2px solid #9b7418;box-shadow:inset 0 6px 0 -3px rgba(255,255,255,.35),inset 0 -6px 0 -3px rgba(0,0,0,.12)}
.belt::before,.belt::after{content:"";position:absolute;left:10px;right:10px;height:4px;background:radial-gradient(circle,#8a6514 1.6px,transparent 2px) 0 0/12px 4px repeat-x}
.belt::before{top:5px} .belt::after{bottom:5px}
.belt .plate{display:inline-block;background:radial-gradient(circle at 35% 30%,#fff3c9,#f2c14e 55%,#b9861c);border:3px solid #8a6514;border-radius:50%;width:66px;height:66px;line-height:60px;font-family:var(--poster);font-size:1.25rem;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.belt .plate span{color:var(--a2)} .belt .plate em{font-style:normal;color:var(--b2)}
.belt h4{margin:8px 0 2px;font-family:var(--poster);font-weight:400;font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase}
.belt p{margin:0;font-size:.85rem;font-weight:600}
.card .btn.ghost{color:#1a1205;border-color:#d9cfb7}

/* footer */
.foot{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.foot button,.foot a{background:none;border:0;color:var(--mute);text-decoration:underline;text-underline-offset:3px;padding:6px 2px;font-family:var(--mono);font-size:.72rem}
.foot .logbtn{color:var(--gold);text-decoration:none;border:1.5px solid rgba(255,200,87,.5);border-radius:999px;padding:6px 12px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(3,4,12,.7);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ink2);border-top:3px solid var(--gold);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:16px 16px 26px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;animation:up .25s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{font-family:var(--poster);font-size:2rem;letter-spacing:.04em;text-transform:uppercase;color:var(--cream);margin:4px 0 2px}
.sheet .s{color:var(--mute);font-size:.92rem;margin:0 0 8px}
.sec{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:18px 0 6px}
.fl{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px}
.fl .q{font-family:var(--poster);text-transform:uppercase;font-size:1.12rem;line-height:1.05;letter-spacing:.02em;color:var(--cream)}
.fl .st{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(255,200,87,.16);color:var(--gold)}
.fl .st.ok{background:rgba(63,191,138,.16);color:#7fe0b4}
.fl .h{font-size:.84rem;color:var(--mute);margin-top:6px;line-height:1.3}
.fl .h b{font-weight:600} .fl .h .a{color:var(--a)} .fl .h .b{color:var(--b)}
.fl .n{font-family:var(--hand);font-size:1.35rem;line-height:1.05;color:var(--cream);margin-top:4px}
.fl .rm{margin-top:8px;background:none;border:1.5px solid var(--line);border-radius:999px;color:var(--text);padding:5px 12px;font-size:.82rem;font-weight:600}
.fl .rm[disabled]{opacity:.5}
.sheet .belt{margin-top:8px}

/* overlays */
.fx{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.cd{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,6,16,.88);pointer-events:auto;text-align:center}
.cd .r{font-family:var(--poster);font-size:clamp(3rem,16vw,5rem);color:var(--cream);letter-spacing:.04em;line-height:.9;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.cd .t{font-family:var(--mono);font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.cd .n{font-family:var(--poster);font-size:clamp(7rem,40vw,12rem);line-height:1;color:var(--gold);text-shadow:6px 6px 0 var(--a2),-6px -6px 0 var(--b2);margin-top:6px;min-height:1em}
.cd .n.tick{animation:tick .8s cubic-bezier(.2,1.5,.4,1)}
.cd .bell{width:90px;height:90px;margin:0 auto;animation:ring .5s ease-in-out 2}
.cd .skip{position:absolute;bottom:24px;left:0;right:0;font-family:var(--mono);font-size:.68rem;color:var(--mute)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes tick{0%{transform:scale(2.2);opacity:0}25%{transform:scale(.92);opacity:1}40%{transform:scale(1)}100%{transform:scale(.9);opacity:.85}}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
.flashw{position:absolute;inset:0;background:#fff;animation:flashw .5s ease-out .38s both}
@keyframes flashw{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
.gl{position:absolute;top:38%;width:46vw;max-width:220px}
.gl.a{left:50%;margin-left:-46vw;color:var(--a);animation:punchL .48s cubic-bezier(.5,0,.6,1.4) forwards}
.gl.b{right:50%;margin-right:-46vw;color:var(--b);transform:scaleX(-1);animation:punchR .48s cubic-bezier(.5,0,.6,1.4) forwards}
@media (min-width:480px){.gl.a{margin-left:-220px}.gl.b{margin-right:-220px}}
@keyframes punchL{from{transform:translateX(-80vw) rotate(-10deg)}to{transform:translateX(8px) rotate(0)}}

function xmur3(str){
  var h = 1779033703 ^ str.length;
  for (var i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return function(){ h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
}
function mulberry32(a){
  return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function shuffled(arr, seedStr){
  var rnd = mulberry32(xmur3(seedStr)()), a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function tierOf(id){ for (var t = 0; t < TIERS.length; t++) if (TIERS[t].key === String(id).charAt(0)) return t; return -1; }
function cardText(id){ var t = tierOf(id); return t < 0 ? '' : (TIERS[t].cards[+String(id).slice(1)] || ''); }
function validCard(id){ return typeof id === 'string' && !!cardText(id); }
function isSide(s){ return s === 'A' || s === 'D'; }

// The whole match is rebuilt from the ordered event log, so both phones always agree.
function reduce(events, seed){
  var list = events.slice().sort(function(a, b){ return a.seq - b.seq; });
  var order = TIERS.map(function(t){ return shuffled(t.cards.map(function(_, i){ return t.key + i; }), seed + ':' + t.key); });
  var cursor = [0, 0, 0], retired = {}, table = [], history = [], refs = [], queued = [], boutN = 0, B = null;

  function upcoming(id){ if (!B) return false; for (var i = B.idx; i < B.rounds.length; i++) if (B.rounds[i].card === id) return true; return false; }
  function draw(t){
    var o = order[t], n = o.length;
    for (var k = 0; k < n; k++){
      var id = o[cursor[t] % n]; cursor[t]++;
      if (!retired[id] && table.indexOf(id) < 0 && !upcoming(id)) return id;
    }
    return null;
  }
  function round(id, kind){ return {card: id, tier: tierOf(id), kind: kind, votes: [null, null], guesses: [null, null], ref: null, result: null, at: null}; }
  function startBout(date){
    boutN++;
    B = {n: boutN, dealt: date || null, started: null, ready: [false, false], idx: 0, rounds: []};
    for (var t = 0; t < TIERS.length; t++) for (var k = 0; k < TIERS[t].count; k++){ var id = draw(t); if (id) B.rounds.push(round(id, 'fresh')); }
    queued.forEach(function(id){ if (!upcoming(id)) B.rounds.push(round(id, 'rematch')); });
    queued = [];
    if (table.length){ var tid = table.shift(); B.rounds.push(round(tid, 'table')); }
  }
  startBout(null);

  list.forEach(function(ev){
    var p = ev.player, pl = ev.payload || {}, k = ev.kind;
    var started = B.ready[0] && B.ready[1], R = B.rounds[B.idx];
    var inRound = started && !!R;
    var revealed = inRound && R.votes[0] !== null && R.votes[1] !== null;
    var here = inRound && pl.b === B.n && pl.i === B.idx;
    if (p !== 0 && p !== 1) return;

    if (k === 'ready'){
      if (pl.b === B.n && !started){ B.ready[p] = true; if (B.ready[0] && B.ready[1]) B.started = ev.created_at || null; }
    } else if (k === 'vote'){
      if (here && !R.ref && !revealed && R.votes[p] === null && isSide(pl.side)){
        R.votes[p] = pl.side; R.guesses[p] = isSide(pl.guess) ? pl.guess : null;
        if (R.votes[0] !== null && R.votes[1] !== null) R.at = ev.created_at || null;
      }
    } else if (k === 'ref'){
      if (here && !revealed && !R.ref) R.ref = {by: p};
    } else if (k === 'refback'){
      if (here && R.ref && R.ref.by === p) R.ref = null;
    } else if (k === 'refres'){
      if (here && R.ref && R.ref.by !== p && (pl.act === 'skip' || pl.act === 'table')){
        var id = R.card;
        refs.push({card: id, act: pl.act, by: R.ref.by, date: ev.created_at || null, bout: B.n});
        if (pl.act === 'skip') retired[id] = true;
        else if (table.indexOf(id) < 0) table.push(id);
        var nid = R.kind === 'fresh' ? draw(R.tier) : null;
        if (nid){ var nr = round(nid, 'fresh'); nr.sub = true; B.rounds[B.idx] = nr; }
        else B.rounds.splice(B.idx, 1);
      }
    } else if (k === 'result'){
      if (here && revealed && R.votes[0] !== R.votes[1] && (pl.r === 'ko' || pl.r === 'decision' || pl.r === 'draw')){
        if (pl.r === 'ko' && pl.w !== 0 && pl.w !== 1) return;
        R.result = {r: pl.r, w: pl.r === 'ko' ? pl.w : null, note: String(pl.note || '').slice(0, 200), by: p};
      }
    } else if (k === 'next'){
      if (here && revealed && (R.votes[0] === R.votes[1] || R.result)){
        history.push({bout: B.n, round: B.idx + 1, card: R.card, tier: R.tier, kind: R.kind, votes: R.votes.slice(), guesses: R.guesses.slice(),
                      result: R.result, date: R.at || ev.created_at || null});
        B.idx++;
      }
    } else if (k === 'newbout'){
      if (pl.b === B.n && started && B.idx >= B.rounds.length) startBout(ev.created_at);
    } else if (k === 'rematch'){
      var c = pl.card;
      if (!validCard(c) || retired[c] || table.indexOf(c) >= 0 || upcoming(c) || queued.indexOf(c) >= 0) return;
      if (started && B.idx >= B.rounds.length) queued.push(c);
      else if (started) B.rounds.splice(B.idx + 1, 0, round(c, 'rematch'));
      else B.rounds.push(round(c, 'rematch'));
    }
  });

  var started = B.ready[0] && B.ready[1], R = B.rounds[B.idx] || null, stage;
  if (!started) stage = 'ready';
  else if (!R) stage = 'summary';
  else if (R.ref) stage = 'ref';
  else if (R.votes[0] !== null && R.votes[1] !== null) stage = R.votes[0] === R.votes[1] ? 'nocontest' : 'fight';
  else stage = 'vote';

  var st = {fights: 0, nc: 0, ko: [0, 0], decision: 0, draw: 0, made: [0, 0], hit: [0, 0], bouts: boutN};
  history.forEach(function(h){
    if (h.votes[0] === h.votes[1]) st.nc++;
    else { st.fights++; if (h.result){ if (h.result.r === 'ko') st.ko[h.result.w]++; else st[h.result.r]++; } }
    for (var q = 0; q < 2; q++) if (h.guesses[q] !== null){ st.made[q]++; if (h.guesses[q] === h.votes[1 - q]) st.hit[q]++; }
  });
  return {B: B, R: R, stage: stage, history: history, refs: refs, table: table.slice(), retired: retired, queued: queued.slice(), stats: st};
}
// LOGIC END

(function(){
  var $ = function(id){ return document.getElementById(id); };
  var KEY = 'datenight-khadi-manny-v1', SHOTKEY = 'datenight-fight-shot';
  var ROOM = 'fight';
  var NAMES = ['Khadi', 'Manny'];
  var SIDE = {A: 'Agree', D: 'Disagree'};
  var cfg = window.DATENIGHT, sb = null;
  var room = null, me = 0, events = new Map(), S = null;
  var channel = null, pollTimer = null, live = false;
  var lastKey = null, lastStage = null, first = true, pendingSide = null, notes = {}, logOpen = false, fxTok = 0;
  var shotOn = false; try { shotOn = localStorage.getItem(SHOTKEY) === '1'; } catch(e){}
  var reduceMotion = false; try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
  var GLOVE = '<svg viewBox="0 0 140 100"><use href="#glove"/></svg>';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function saveSession(){ try { localStorage.setItem(KEY, JSON.stringify({slot: me})); } catch(e){} }
  function loadSession(){ try { var r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
  function clearSession(){ try { localStorage.removeItem(KEY); } catch(e){} }
  function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms || 30); } catch(e){} }
  function fmtDate(iso){ if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined}); }
  var toastT = null;
  function toast(msg){
    var t = document.querySelector('.toast'); if (t) t.remove();
    t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    clearTimeout(toastT); toastT = setTimeout(function(){ t.remove(); }, 2600);
  }
  function corner(p){ return p === 0 ? 'a' : 'b'; }

  /* ---------- lobby + connection ---------- */
  function lobbyErr(m){ $('err').textContent = m || ''; }
  function makeSeed(){ return Math.random().toString(36).slice(2, 10); }
  function friendly(err){
    var m = String((err && err.message) || err || '');
    if (/schema cache|does not exist|relation/i.test(m)) return 'The database is not set up yet. Run the SQL setup in Supabase, then refresh.';
    return 'Something went wrong: ' + m;
  }
  async function pick(slot){
    lobbyErr('');
    var btns = document.querySelectorAll('.whobtn'); btns.forEach(function(b){ b.disabled = true; });
    try {
      for (var attempt = 0; attempt < 3; attempt++){
        var res = await sb.from('rooms').select('*').eq('code', ROOM).maybeSingle();
        if (res.error){ lobbyErr(friendly(res.error)); return; }
        if (res.data){ await enterRoom(res.data, slot); return; }
        var seed = makeSeed();
        var ins = await sb.from('rooms').insert({code: ROOM, game: 'fight', seed: seed, p0_name: NAMES[0], p1_name: NAMES[1]});
        if (!ins.error){ await enterRoom({code: ROOM, seed: seed}, slot); return; }
        if (ins.error.code !== '23505'){ lobbyErr(friendly(ins.error)); return; }
      }
      lobbyErr('Could not open the ring. Try again.');
    } catch(e){ lobbyErr('Could not reach the server. Check your connection.'); }
    finally { btns.forEach(function(b){ b.disabled = false; }); }
  }
  async function enterRoom(r, slot){
    room = r; me = slot; events = new Map(); lastKey = null; lastStage = null; first = true; pendingSide = null; notes = {};
    saveSession();
    $('lobby').classList.add('hidden'); $('game').classList.remove('hidden');
    await fetchAll(); subscribe(); startPoll(); render();
  }
  function maxSeq(){ var m = -1; events.forEach(function(_, k){ if (k > m) m = k; }); return m; }
  function addEvent(ev, quiet){
    if (events.has(ev.seq)) return false;
    events.set(ev.seq, ev);
    if (!quiet && !first && ev.player !== me){
      var who = NAMES[ev.player], pl = ev.payload || {};
      if (ev.kind === 'ready'){ buzz(); toast(who + ' touched gloves'); }
      else if (ev.kind === 'vote'){ buzz(20); toast(who + ' is locked in'); }
      else if (ev.kind === 'ref'){ buzz([60, 40, 60]); toast(who + ' called the ref'); }
      else if (ev.kind === 'refback'){ toast(who + ' waved the ref off'); }
      else if (ev.kind === 'refres'){ toast(pl.act === 'skip' ? 'Card thrown out' : 'Card tabled for later'); }
      else if (ev.kind === 'result'){ toast(who + ' scored it: ' + (pl.r === 'ko' ? 'KO ' + NAMES[pl.w] : (pl.r === 'draw' ? 'Draw' : 'Decision'))); }
      else if (ev.kind === 'newbout'){ toast(who + ' booked the next bout'); }
      else if (ev.kind === 'rematch'){ toast(who + ' booked a rematch'); }
    }
    return true;
  }
  async function fetchAll(){
    try {
      var res = await sb.from('events').select('*').eq('room', room.code).gt('seq', maxSeq()).order('seq', {ascending: true}).limit(1000);
      if (res.error) return false;
      var changed = false;
      (res.data || []).forEach(function(ev){ if (addEvent(ev, false)) changed = true; });
      if (changed) render();
      return true;
    } catch(e){ return false; }
  }
  function subscribe(){
    try {
      if (channel) sb.removeChannel(channel);
      channel = sb.channel('fight-' + room.code)
        .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'events', filter: 'room=eq.' + room.code}, function(p){ if (addEvent(p.new, false)) render(); })
        .subscribe(function(status){ live = status === 'SUBSCRIBED'; setConn(); });
    } catch(e){ live = false; setConn(); }
  }
  function startPoll(){
    clearInterval(pollTimer);
    pollTimer = setInterval(function(){ if (!document.hidden) fetchAll(); }, 3000);
    document.onvisibilitychange = function(){ if (!document.hidden && room) fetchAll(); };
  }
  function setConn(){ $('conn').className = 'conn ' + (live ? 'live' : 'slow'); $('connt').textContent = live ? 'Live' : 'Syncing'; }
  async function send(kind, payload){
    for (var t = 0; t < 4; t++){
      var row = {room: room.code, seq: maxSeq() + 1, player: me, kind: kind, payload: payload || {}, created_at: new Date().toISOString()};
      var res = await sb.from('events').insert({room: row.room, seq: row.seq, player: row.player, kind: row.kind, payload: row.payload});
      if (!res.error){ addEvent(row, true); render(); return true; }
      if (res.error.code === '23505'){ await fetchAll(); continue; }
      toast('That did not send. Check your connection and try again.');
      return false;
    }
    toast('You both moved at once. Try that again.');
    return false;
  }

  /* ---------- pieces ---------- */
  function tierLabel(R){
    if (R.kind === 'table') return 'Unfinished business';
    if (R.kind === 'rematch') return 'Rematch';
    return TIERS[R.tier].name;
  }
  function tierClass(R){ return R.kind === 'fresh' ? 't' + R.tier : 'ub'; }
  function chip(p, on, label){
    return '<div class="chip ' + corner(p) + (on ? ' on' : '') + '"><span class="d">' + NAMES[p].charAt(0) + '</span><span>' + NAMES[p] + ' <small>' + label + '</small></span></div>';
  }
  function poster(R, B, anim){
    return '<div class="poster' + (anim ? ' anim' : '') + '"><div class="bill"><span class="tier ' + tierClass(R) + '">' + esc(tierLabel(R)) + (R.sub ? ' · sub' : '') + '</span><span>Round ' + (B.idx + 1) + ' of ' + B.rounds.length + '</span></div>' +
      '<h2 class="stmt">' + esc(cardText(R.card)) + '</h2>' +
      '<div class="vsrow"><span class="a">Khadi</span><i>Agree or disagree</i><span class="b">Manny</span></div></div>';
  }
  function shotBadge(R, p){
    var g = R.guesses[p]; if (g === null) return '';
    return '<em>' + (g === R.votes[1 - p] ? 'Called it' : 'Missed the call') + '</em>';
  }
  function corners(R){
    return '<div class="corners"><div class="corner a"><small>Khadi</small><b>' + SIDE[R.votes[0]] + '</b>' + shotBadge(R, 0) + '</div>' +
      '<div class="corner b"><small>Manny</small><b>' + SIDE[R.votes[1]] + '</b>' + shotBadge(R, 1) + '</div></div>';
  }
  function resultText(r){
    if (!r) return 'Not scored';
    if (r.r === 'ko') return 'KO ' + NAMES[r.w];
    return r.r === 'draw' ? 'Draw' : 'Decision';
  }
  function belt(st){
    var shots = (st.made[0] || st.made[1]) ? '<p>Called shots: Khadi ' + st.hit[0] + '/' + st.made[0] + ' · Manny ' + st.hit[1] + '/' + st.made[1] + '</p>' : '';
    return '<div class="belt"><div class="plate"><span>K</span>×<em>M</em></div><h4>' + st.nc + ' no contests · ' + st.fights + ' fights</h4>' +
      '<p>KOs: Khadi ' + st.ko[0] + ' · Manny ' + st.ko[1] + ' · Decisions ' + st.decision + ' · Draws ' + st.draw + '</p>' + shots + '</div>';
  }

  /* ---------- render ---------- */
  function render(){
    if (!room) return;
    var fa = document.activeElement, hadNote = fa && fa.id === 'note', pos = hadNote ? fa.selectionStart : 0;
    S = reduce(Array.from(events.values()), room.seed);
    var B = S.B, R = S.R, stg = S.stage, other = 1 - me, st = S.stats;
    var key = R && stg !== 'ready' ? B.n + ':' + B.idx + ':' + R.card : 'b' + B.n + ':' + stg;

    // live moments
    if (!first){
      if (key !== lastKey && stg === 'vote') countdown(B, R);
      else if (key === lastKey && (lastStage === 'vote' || lastStage === 'ref') && stg === 'fight') fightFx();
      else if (key === lastKey && (lastStage === 'vote' || lastStage === 'ref') && stg === 'nocontest') booFx();
    }
    var fresh = key !== lastKey;
    if (fresh) pendingSide = null;
    if (stg !== 'vote') pendingSide = null;
    lastKey = key; lastStage = stg; first = false;
    setConn();

    // tale of the tape
    $('tape').innerHTML = '<div class="c a"><small>Red corner</small><b>Khadi</b></div>' +
      '<div class="mid"><b>Bout ' + B.n + '</b>' + st.fights + ' fights<br>' + st.nc + ' no contests</div>' +
      '<div class="c b"><small>Blue corner</small><b>Manny</b></div>';
    var pips = '', lastTier = null;
    B.rounds.forEach(function(r, i){
      var grp = r.kind === 'fresh' ? r.tier : 9;
      if (lastTier !== null && grp !== lastTier) pips += '<i class="gap"></i>';
      lastTier = grp;
      var c = '';
      if (i < B.idx) c = r.votes[0] === r.votes[1] ? 'nc' : 'fight';
      else if (i === B.idx && stg !== 'ready' && stg !== 'summary') c = 'now';
      if (r.kind !== 'fresh') c += ' ub';
      pips += '<i class="' + c + '"></i>';
    });
    $('pips').innerHTML = pips;
    $('shot').textContent = 'Call your shot: ' + (shotOn ? 'On' : 'Off');

    var h = '';
    if (stg === 'ready'){
      var ub = B.rounds.filter(function(r){ return r.kind !== 'fresh'; }).length;
      h += '<div class="poster anim"><div class="bill"><span class="tier">Bout ' + B.n + '</span><span>' + B.rounds.length + ' rounds</span></div>' +
        '<h2 class="stmt" style="font-size:clamp(2.4rem,12vw,3.4rem)">Khadi vs Manny</h2>' +
        '<div class="vsrow" style="font-size:.95rem"><span class="a">Undercard</span><i>·</i><span style="color:var(--cream)">Main card</span><i>·</i><span class="b">Main event</span></div>' +
        (ub ? '<p style="margin:12px 0 0;font-family:var(--mono);font-size:.72rem;color:var(--gold);letter-spacing:.06em">+ ' + ub + ' ' + (ub === 1 ? 'card' : 'cards') + ' of unfinished business at the end</p>' : '') + '</div>';
      h += '<div class="act"><div class="msg"><p>Pick a side on every card. No fence sitting. If it depends, pick the side you can defend.</p></div>';
      h += '<div class="chips">' + chip(0, B.ready[0], B.ready[0] ? 'gloves on' : 'warming up') + chip(1, B.ready[1], B.ready[1] ? 'gloves on' : 'warming up') + '</div>';
      h += B.ready[me] ? '<button class="btn" disabled>Waiting for ' + esc(NAMES[other]) + '</button>' : '<button class="btn gold" id="ready" type="button">Touch gloves</button>';
      h += '</div>';
    } else if (stg === 'vote'){
      h += poster(R, B, fresh);
      h += '<div class="act">';
      var mine = R.votes[me];
      if (mine === null && pendingSide === null){
        h += '<div class="sides"><button class="side ag" type="button" data-side="A">Agree</button><button class="side dis" type="button" data-side="D">Disagree</button></div>';
      } else if (mine === null){
        h += '<div class="msg"><h3>Call your shot</h3><p>You said ' + SIDE[pendingSide] + '. What will ' + esc(NAMES[other]) + ' say?</p></div>';
        h += '<div class="sides"><button class="side ag" type="button" data-guess="A">Agree<small>' + esc(NAMES[other]) + ' will</small></button><button class="side dis" type="button" data-guess="D">Disagree<small>' + esc(NAMES[other]) + ' will</small></button></div>';
        h += '<button class="btn ghost" type="button" data-guess="none">No call, just lock it in</button>';
        h += '<button class="ref" type="button" id="unpick">Change my side</button>';
      } else {
        h += '<div class="sealed"><small>Your pick is sealed</small><b>' + SIDE[mine] + '</b></div>';
      }
      h += '<div class="chips">' + chip(0, R.votes[0] !== null, R.votes[0] !== null ? 'locked in' : 'thinking') + chip(1, R.votes[1] !== null, R.votes[1] !== null ? 'locked in' : 'thinking') + '</div>';
      h += '<button class="ref" type="button" id="ref">Call the ref</button></div>';
    } else if (stg === 'ref'){
      h += poster(R, B, false);
      h += '<div class="act">';
      if (R.ref.by === me){
        h += '<div class="msg"><h3>Ref is on the way</h3><p>Waiting for ' + esc(NAMES[other]) + ' to throw it out or table it.</p></div>';
        h += '<button class="btn ghost" type="button" id="refback">Wave the ref off</button>';
      } else {
        h += '<div class="msg"><h3>' + esc(NAMES[R.ref.by]) + ' called the ref</h3><p>No questions asked. How do you want to handle this one?</p></div>';
        h += '<button class="btn gold" type="button" data-act="table">Table it<br><span style="font-family:var(--body);text-transform:none;letter-spacing:0;font-size:.82rem;font-weight:600">It comes back in your next bout</span></button>';
        h += '<button class="btn" type="button" data-act="skip">Throw it out<br><span style="font-family:var(--body);text-transform:none;letter-spacing:0;font-size:.82rem;font-weight:600;opacity:.8">It never comes back</span></button>';
      }
      h += '</div>';
    } else if (stg === 'fight' || stg === 'nocontest'){
      h += poster(R, B, false);
      h += '<div class="act">' + corners(R);
      if (stg === 'nocontest'){
        h += '<div class="verdict nc"><h3>No contest</h3><p>Same corner. The crowd wanted a fight.</p></div>';
        h += '<button class="btn gold" type="button" id="next">' + (B.idx === B.rounds.length - 1 ? 'To the scorecards' : 'Next round') + '</button>';
      } else {
        h += '<div class="verdict f"><h3>Fight!</h3><p>Talk it out. When you are done, score the round.</p></div>';
        var r = R.result, on = function(rr, w){ return r && r.r === rr && (rr !== 'ko' || r.w === w) ? ' on' : ''; };
        h += '<div class="cards4">' +
          '<button class="res ka' + on('ko', 0) + '" type="button" data-r="ko" data-w="0"><b>KO Khadi</b><small>Manny came around</small></button>' +
          '<button class="res kb' + on('ko', 1) + '" type="button" data-r="ko" data-w="1"><b>KO Manny</b><small>Khadi came around</small></button>' +
          '<button class="res' + on('decision') + '" type="button" data-r="decision"><b>Decision</b><small>Met in the middle</small></button>' +
          '<button class="res' + on('draw') + '" type="button" data-r="draw"><b>Draw</b><small>Agree to disagree</small></button></div>';
        h += '<div class="setby">' + (r ? 'Scored by ' + esc(NAMES[r.by]) + '. Either of you can change it.' : '') + '</div>';
        var nv = notes[key] !== undefined ? notes[key] : (r ? r.note : '');
        h += '<input class="note" id="note" type="text" maxlength="200" placeholder="Where we landed (optional)" value="' + esc(nv) + '" autocomplete="off">';
        h += '<button class="btn gold" type="button" id="next"' + (r ? '' : ' disabled') + '>' + (r ? (B.idx === B.rounds.length - 1 ? 'To the scorecards' : 'Next round') : 'Score it to continue') + '</button>';
      }
      h += '</div>';
    } else {
      var rs = B.rounds, f = rs.filter(function(x){ return x.votes[0] !== x.votes[1]; }).length;
      h += '<div class="card"><div class="bill"><span class="tier">Bout ' + B.n + '</span><span>Official scorecard</span></div>';
      h += '<div class="bigline">' + (f === 0 ? 'Clean sweep. Not one fight.' : (f === 1 ? 'One fight on the card.' : f + ' fights on the card.')) + '</div>';
      h += '<div class="stats"><div><b>' + f + '</b><small>Fights</small></div><div><b>' + (rs.length - f) + '</b><small>No contests</small></div><div><b>' + rs.length + '</b><small>Rounds</small></div></div>';
      h += '<div class="rl">';
      rs.forEach(function(x){
        var sp = x.votes[0] !== x.votes[1];
        h += '<div class="' + (sp ? 'f' : '') + '"><i></i><span>' + esc(cardText(x.card)) + '</span><em>' + (sp ? esc(resultText(x.result)) : 'NC') + '</em></div>';
      });
      h += '</div>' + belt(st);
      if (S.table.length || S.queued.length) h += '<p style="margin:10px 0 0;font-size:.85rem;font-weight:600;text-align:center">' + (S.table.length ? 'Unfinished business is waiting for the next bout.' : 'Rematch booked for the next bout.') + '</p>';
      h += '<button class="btn gold" type="button" id="newbout">Book the next bout</button>';
      h += '<button class="btn ghost" type="button" id="log2">Open the Fight Log</button></div>';
    }
    $('stage').innerHTML = h;
    if (hadNote && $('note')){ var el = $('note'); el.focus(); try { el.setSelectionRange(pos, pos); } catch(e){} }
    if (logOpen) renderLog();
  }

  /* ---------- fight log ---------- */
  function renderLog(){
    var old = document.querySelector('.sheet'), top = old ? old.scrollTop : 0;
    var B = S.B, upcoming = {};
    for (var i = B.idx; i < B.rounds.length; i++) upcoming[B.rounds[i].card] = true;
    S.queued.forEach(function(c){ upcoming[c] = true; });
    var groups = {}, order = [];
    S.history.forEach(function(e){ if (!groups[e.card]){ groups[e.card] = []; order.push(e.card); } groups[e.card].push(e); });
    var fought = order.filter(function(c){ return groups[c].some(function(e){ return e.votes[0] !== e.votes[1]; }); });
    fought.sort(function(a, b){ var x = groups[a][groups[a].length - 1], y = groups[b][groups[b].length - 1]; return (y.date || '') < (x.date || '') ? -1 : 1; });

    var h = '<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Fight Log">';
    h += '<div class="bill"><span>Khadi vs Manny</span><span>' + S.stats.bouts + (S.stats.bouts === 1 ? ' bout' : ' bouts') + '</span></div><h3>Fight Log</h3>';
    h += '<p class="s">Every card you landed in different corners. Book a rematch to see if you still stand there.</p>';
    h += belt(S.stats);
    if (S.table.length){
      h += '<div class="sec">Back in the ring</div>';
      S.table.forEach(function(c, i){ h += '<div class="fl"><div class="q">' + esc(cardText(c)) + '</div><span class="st">' + (i === 0 ? 'Next bout' : 'Tabled') + '</span></div>'; });
    }
    h += '<div class="sec">The fights</div>';
    if (!fought.length) h += '<p class="s">No fights yet. Every round so far has been a no contest.</p>';
    fought.forEach(function(c){
      var es = groups[c], last = es[es.length - 1], still = last.votes[0] !== last.votes[1];
      h += '<div class="fl"><div class="q">' + esc(cardText(c)) + '</div><span class="st' + (still ? '' : ' ok') + '">' + (still ? 'Still a fight' : 'Settled') + '</span>';
      es.slice().reverse().forEach(function(e){
        var sp = e.votes[0] !== e.votes[1];
        h += '<div class="h">' + esc(fmtDate(e.date) || 'Bout ' + e.bout) + ': <b class="a">Khadi ' + SIDE[e.votes[0]] + '</b>, <b class="b">Manny ' + SIDE[e.votes[1]] + '</b>. ' + (sp ? esc(resultText(e.result)) + '.' : 'Same corner.') + '</div>';
        if (e.result && e.result.note) h += '<div class="n">“' + esc(e.result.note) + '”</div>';
      });
      var blocked = upcoming[c] || S.table.indexOf(c) >= 0 || S.retired[c];
      h += '<button class="rm" type="button" data-rematch="' + esc(c) + '"' + (blocked ? ' disabled' : '') + '>' + (upcoming[c] ? 'Rematch booked' : 'Rematch: still how we feel?') + '</button></div>';
    });
    h += '<button class="btn ghost" type="button" id="close" style="margin-top:16px">Close</button></div></div>';
    $('sheetmount').innerHTML = h;
    var nw = document.querySelector('.sheet'); if (nw && old) nw.scrollTop = top;
  }
  function closeLog(){ logOpen = false; $('sheetmount').innerHTML = ''; }

  /* ---------- big moments ---------- */
  function clearFx(){ fxTok++; $('fx').innerHTML = ''; $('wrap').classList.remove('shake'); }
  function countdown(B, R){
    clearFx(); if (reduceMotion) return;
    var tok = fxTok, fx = $('fx');
    fx.innerHTML = '<div class="cd" id="cd"><div><div class="r">Round ' + (B.idx + 1) + '</div><div class="t">' + esc(tierLabel(R)) + '</div><div class="n" id="cdn"></div></div><div class="skip">Tap to skip</div></div>';
    var seq = ['3', '2', '1'], i = 0;
    function step(){
      if (tok !== fxTok) return;
      var n = $('cdn'); if (!n) return;
      if (i < seq.length){
        n.className = 'n'; void n.offsetWidth; n.className = 'n tick'; n.textContent = seq[i]; buzz(25); i++;
        setTimeout(step, 800);
      } else {
        n.className = 'n'; n.innerHTML = '<svg class="bell" viewBox="0 0 64 64" style="display:block"><path d="M32 8c-11 0-18 8-18 20v10l-6 8h48l-6-8V28c0-12-7-20-18-20z" fill="#ffc857"/><circle cx="32" cy="52" r="6" fill="#ffc857"/><rect x="29" y="2" width="6" height="8" rx="3" fill="#ffc857"/></svg>';
        buzz([30, 50, 30]);
        setTimeout(function(){ if (tok === fxTok) clearFx(); }, 700);
      }
    }
    setTimeout(step, 450);
  }
  function fightFx(){
    clearFx(); buzz([80, 40, 120]);
    var tok = fxTok, fx = $('fx');
    fx.innerHTML = '<div class="flashw"></div><div class="gl a">' + GLOVE + '</div><div class="gl b">' + GLOVE + '</div>' +
      '<svg class="burst" viewBox="0 0 200 200"><polygon fill="#ffc857" points="100,0 118,62 182,36 140,88 200,112 134,124 156,190 100,146 44,190 66,124 0,112 60,88 18,36 82,62"/></svg>' +
      '<div class="fword">Fight!</div>';
    void $('wrap').offsetWidth; $('wrap').classList.add('shake');
    setTimeout(function(){ if (tok === fxTok) clearFx(); }, 2500);
  }
  function booFx(){
    clearFx(); buzz(15);
    var tok = fxTok, fx = $('fx'), h = '<div class="stamp">No contest<small>Same corner</small></div>';
    if (!reduceMotion){
      var words = ['BOO', 'boo', 'BOOO', 'Boo!', '👎', 'BOO', '🍅'];
      for (var i = 0; i < 22; i++){
        var w = words[i % words.length], size = 1 + Math.random() * 1.8;
        h += '<span class="boo" style="left:' + (Math.random() * 92) + '%;font-size:' + size.toFixed(2) + 'rem;--r:' + (Math.random() * 30 - 15).toFixed(0) + 'deg;animation-duration:' + (1.6 + Math.random() * 1.4).toFixed(2) + 's;animation-delay:' + (Math.random() * .8).toFixed(2) + 's">' + w + '</span>';
      }
    }
    fx.innerHTML = h;
    setTimeout(function(){ if (tok === fxTok) clearFx(); }, 3200);
  }

  /* ---------- input ---------- */
  function ctx(){ var B = S.B; return {b: B.n, i: B.idx}; }
  function noteFor(){ var k = lastKey; return notes[k] !== undefined ? notes[k] : (S.R && S.R.result ? S.R.result.note : ''); }
  document.addEventListener('click', async function(e){
    if (e.target && e.target.id === 'sbg'){ closeLog(); return; }
    if (e.target && e.target.closest && e.target.closest('#cd')){ clearFx(); return; }
    var t = e.target.closest ? e.target.closest('button') : null; if (!t) return;
    if (t.dataset.slot !== undefined){ pick(+t.dataset.slot); return; }
    if (!room) return;
    var c = ctx();
    if (t.id === 'ready'){ send('ready', {b: c.b}); return; }
    if (t.dataset.side){
      if (shotOn){ pendingSide = t.dataset.side; render(); return; }
      send('vote', {b: c.b, i: c.i, side: t.dataset.side, guess: null}); return;
    }
    if (t.dataset.guess){
      var side = pendingSide; if (!side) return; pendingSide = null;
      send('vote', {b: c.b, i: c.i, side: side, guess: t.dataset.guess === 'none' ? null : t.dataset.guess}); return;
    }
    if (t.id === 'unpick'){ pendingSide = null; render(); return; }
    if (t.id === 'ref'){ send('ref', c); return; }
    if (t.id === 'refback'){ send('refback', c); return; }
    if (t.dataset.act){ send('refres', {b: c.b, i: c.i, act: t.dataset.act}); return; }
    if (t.dataset.r){
      var p = {b: c.b, i: c.i, r: t.dataset.r, note: noteFor()};
      if (t.dataset.w !== undefined) p.w = +t.dataset.w;
      send('result', p); return;
    }
    if (t.id === 'next'){
      var R = S.R;
      if (R && R.result && noteFor() !== R.result.note){
        var ok = await send('result', {b: c.b, i: c.i, r: R.result.r, w: R.result.w, note: noteFor()});
        if (!ok) return;
      }
      send('next', c); return;
    }
    if (t.id === 'newbout'){ send('newbout', {b: c.b}); return; }
    if (t.id === 'log' || t.id === 'log2'){ logOpen = true; renderLog(); return; }
    if (t.id === 'close'){ closeLog(); return; }
    if (t.dataset.rematch){
      var ok2 = await send('rematch', {card: t.dataset.rematch});
      if (ok2) toast(S.stage === 'summary' ? 'Rematch booked for the next bout' : (S.stage === 'ready' ? 'Rematch added to this bout' : 'Rematch is up after this round'));
      return;
    }
    if (t.id === 'shot'){ shotOn = !shotOn; try { localStorage.setItem(SHOTKEY, shotOn ? '1' : '0'); } catch(e2){} render(); return; }
    if (t.id === 'leave'){ leave(); return; }
  });
  document.addEventListener('input', function(e){ if (e.target && e.target.id === 'note') notes[lastKey] = e.target.value; });
  document.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target && e.target.id === 'note'){ e.preventDefault(); e.target.blur(); } });

  function leave(){
    clearSession(); clearInterval(pollTimer); clearFx(); closeLog();
    try { if (channel) sb.removeChannel(channel); } catch(e){}
    room = null; events = new Map();
    $('game').classList.add('hidden'); $('lobby').classList.remove('hidden');
  }

  /* ---------- boot ---------- */
  (async function boot(){
    if (!cfg || !window.supabase){
      lobbyErr('The game could not load its connection. Refresh the page.');
      document.querySelectorAll('.whobtn').forEach(function(b){ b.disabled = true; });
      return;
    }
    sb = window.supabase.createClient(cfg.url, cfg.key);
    var saved = loadSession();
    if (saved && (saved.slot === 0 || saved.slot === 1)){
      try {
        var res = await sb.from('rooms').select('*').eq('code', ROOM).maybeSingle();
        if (res.data){ await enterRoom(res.data, saved.slot); return; }
      } catch(e){}
    }
  })();
})();
</script>
