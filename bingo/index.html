<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1326">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Khadi × Manny</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1326'/%3E%3Cpath d='M32 50C14 38 12 26 19 20c5-4 11-2 13 3 2-5 8-7 13-3 7 6 5 18-13 30z' fill='%23ffc857'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@500;700&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night-mail board for two. Khadi is coral, Manny is sky. Every stamp pulls them a little closer along the route until they meet. */
:root{
  --ink:#0e1326;
  --ink2:#161d3a;
  --line:#2b3668;
  --text:#e9ecfa;
  --mute:#9aa4cf;
  --lamp:#ffc857;
  --a:#ff7a6b;
  --b:#62c8ff;
  --card:#f1f3fb;
  --cardtext:#161a33;
  --cardmute:#5b6390;
  --good:#3fbf8a;
  --bad:#e5645f;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --hand:"Caveat","Bradley Hand",cursive;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);background-image:radial-gradient(900px 520px at 50% -12%,#212c5c 0%,transparent 70%);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.9;animation:twinkle 7s ease-in-out infinite alternate;
  background-image:
  radial-gradient(1.6px 1.6px at 8% 14%,#fff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 22% 38%,#cfd8ff 50%,transparent 52%),
  radial-gradient(1.8px 1.8px at 37% 9%,#fff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 51% 27%,#ffe9b0 50%,transparent 52%),
  radial-gradient(1.6px 1.6px at 66% 12%,#fff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 79% 33%,#cfd8ff 50%,transparent 52%),
  radial-gradient(1.8px 1.8px at 91% 18%,#fff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 14% 62%,#fff 50%,transparent 52%),
  radial-gradient(1.6px 1.6px at 46% 71%,#cfd8ff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 73% 64%,#fff 50%,transparent 52%),
  radial-gradient(1.6px 1.6px at 88% 78%,#ffe9b0 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 30% 88%,#fff 50%,transparent 52%),
  radial-gradient(1.2px 1.2px at 60% 92%,#cfd8ff 50%,transparent 52%),
  radial-gradient(1.6px 1.6px at 4% 84%,#fff 50%,transparent 52%)}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
.stripe{height:10px;background:repeating-linear-gradient(135deg,#d9433b 0 14px,#f4f4f4 14px 28px,#2f5fd0 28px 42px,#f4f4f4 42px 56px)}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.hidden{display:none !important}
.a{--c:var(--a)} .b{--c:var(--b)}

/* tokens */
.dot{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#13172b;font-size:1rem;background:var(--c);box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.16)}

/* lobby */
.hero{padding-top:18px}
.route{position:relative;height:56px;margin:0 6px 6px}
.route::before{content:"";position:absolute;left:18px;right:18px;top:26px;border-top:2px dashed #3b4a8a}
.route .dot{position:absolute;top:10px}
.route .hrt{position:absolute;left:50%;top:14px;width:26px;height:26px;color:var(--lamp);transform:translateX(-50%) scale(.8);opacity:.35}
.hero .route .dot.a{left:0;animation:comeA 3.6s ease-in-out infinite alternate}
.hero .route .dot.b{right:0;animation:comeB 3.6s ease-in-out infinite alternate}
.hero .route .hrt{animation:beat 3.6s ease-in-out infinite alternate}
@keyframes comeA{to{left:36%}} @keyframes comeB{to{right:36%}}
@keyframes beat{to{transform:translateX(-50%) scale(1.25);opacity:1}}
.mark{font-size:clamp(2.1rem,10.6vw,3.4rem);font-weight:800;line-height:1;text-align:center;margin:8px 0 8px;white-space:nowrap}
.mark .n-a{color:var(--a)} .mark .n-b{color:var(--b)}
.mark .x{font-family:var(--hand);font-weight:700;color:var(--lamp);font-size:.8em;padding:0 .06em}
.tag{font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.18em;color:var(--mute);text-align:center;margin:0 0 26px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.whobtn{background:var(--ink2);border:2px solid var(--c);border-radius:18px;padding:18px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .12s ease,background .2s}
.whobtn:active{transform:scale(.97)}
.whobtn:hover{background:#1d2650}
.whobtn .dot{width:48px;height:48px;font-size:1.4rem}
.whobtn b{font-family:var(--display);font-size:1.15rem}
.err{color:#ff9a94;font-size:.9rem;min-height:1.3em;margin:12px 0 0;text-align:center}

/* game header */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.wm{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em}
.wm .a{color:var(--a)} .wm .b{color:var(--b)}
.wm i{font-family:var(--hand);font-style:normal;font-weight:700;color:var(--lamp);padding:0 .12em}
.conn{font-family:var(--mono);font-size:.68rem;color:var(--mute);display:flex;align-items:center;gap:5px}
.conn i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.conn.live i{background:var(--good)} .conn.slow i{background:var(--lamp)}

.journey{--p:0;position:relative;height:62px;margin:2px 4px 8px}
.journey::before{content:"";position:absolute;left:18px;right:18px;top:27px;border-top:2px dashed #3b4a8a}
.journey .dot{position:absolute;top:11px;transition:left .9s cubic-bezier(.3,1.25,.5,1),right .9s cubic-bezier(.3,1.25,.5,1)}
.journey .dot.a{left:calc(var(--p) * 40%)} .journey .dot.b{right:calc(var(--p) * 40%)}
.journey .hrt{position:absolute;left:50%;top:14px;width:28px;height:28px;color:var(--lamp);transform:translateX(-50%) scale(calc(.7 + var(--p) * .6));opacity:calc(.3 + var(--p) * .7);transition:transform .9s,opacity .9s;filter:drop-shadow(0 0 calc(var(--p) * 10px) rgba(255,200,87,.8))}
.journey .cap{position:absolute;left:0;right:0;bottom:0;text-align:center;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

/* banners */
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;background:#2a2450;border:1.5px solid #4a3f8f;font-size:.95rem}
.banner b{font-family:var(--display)}
.ask{background:#fff3d1;color:#2b2410;border-radius:14px;padding:12px 14px;margin-bottom:12px;animation:drop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-10px) scale(.97);opacity:0}}
.ask .k{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#6a5412;display:block;margin-bottom:3px}
.ask .t{font-weight:600}
.ask .n{font-family:var(--hand);font-size:1.3rem;line-height:1.1;color:#5a4a1c;margin:2px 0 8px}
.btn{width:100%;background:var(--lamp);color:#1b1730;border:0;border-radius:14px;padding:15px 16px;font-family:var(--display);font-weight:700;font-size:1.1rem;transition:transform .08s ease}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.sm{padding:11px 12px;font-size:.98rem;border-radius:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* tabs + grid */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tabs button{background:var(--ink2);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:1px}
.tabs button b{font-family:var(--display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button small{font-family:var(--mono);font-size:.68rem;color:var(--mute)}
.tabs button[aria-pressed=true]{border-color:var(--lamp);background:#222a4f}
.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:5px;font-family:var(--display);font-weight:800;text-align:center;letter-spacing:.1em;font-size:1.15rem}
.letters span{color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{position:relative;aspect-ratio:1;background:rgba(255,255,255,.04);border:1.5px dashed #3d4a85;border-radius:8px;padding:4px 3px;display:grid;place-items:center;text-align:center;font-size:.66rem;line-height:1.12;font-weight:600;color:var(--text);overflow:hidden;overflow-wrap:anywhere;text-wrap:balance;transition:transform .12s ease,background .2s}
.cell:active{transform:scale(.94)}
.cell.free{background:#2a2a1e;border:1.5px solid #6b5a1f;color:var(--lamp);font-family:var(--mono);font-size:.56rem;letter-spacing:.08em;display:flex;flex-direction:column;gap:2px;justify-content:center;align-items:center}
.cell.free svg{width:22px;height:22px}
.cell.st0{background:linear-gradient(145deg,#ff9486,#f0634f);border:1.5px solid #ffb4aa;color:#2a1210;outline:1.5px dashed rgba(42,18,16,.35);outline-offset:-5px}
.cell.st1{background:linear-gradient(145deg,#85d6ff,#46b0ee);border:1.5px solid #b5e6ff;color:#0b2233;outline:1.5px dashed rgba(11,34,51,.35);outline-offset:-5px}
.cell .pm{position:absolute;right:-1px;bottom:-1px;width:40%;color:rgba(20,10,10,.55);transform:rotate(-14deg);pointer-events:none}
.cell.slam .pm{animation:slam .6s cubic-bezier(.2,1.7,.4,1)}
.cell.slam{animation:thud .6s ease}
@keyframes slam{0%{transform:rotate(-14deg) scale(3);opacity:0}55%{opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:1}}
@keyframes thud{40%{transform:scale(.92)}100%{transform:scale(1)}}
.cell.pend{border:2px dashed var(--lamp);animation:pend 1.4s ease-in-out infinite}
@keyframes pend{50%{background:#33305a}}
.cell.line{box-shadow:0 0 0 2px var(--lamp),0 0 16px rgba(255,200,87,.6);animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--lamp),0 0 26px rgba(255,200,87,.95)}}

/* postcard sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,8,20,.65);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--cardtext);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:16px 18px 26px;animation:up .24s cubic-bezier(.2,1.2,.4,1);position:relative;border-top:8px solid transparent;border-image:repeating-linear-gradient(135deg,#d9433b 0 14px,#f4f4f4 14px 28px,#2f5fd0 28px 42px,#f4f4f4 42px 56px) 8}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.sheet .eyebrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--cardmute)}
.sheet .chip{border:1.5px dashed var(--cardmute);border-radius:6px;padding:3px 8px}
.sheet h3{font-size:1.55rem;font-weight:700;line-height:1.12;margin:12px 0 6px}
.sheet .sub{color:var(--cardmute);font-size:.98rem;margin:0 0 12px}
.sheet textarea{width:100%;border:2px solid #c9cde3;border-radius:12px;padding:11px 12px;font-family:var(--hand);font-size:1.35rem;line-height:1.1;color:var(--cardtext);background:#fff;min-height:84px;resize:vertical}
.sheet textarea::placeholder{color:#9aa0c4}
.sheet .btn{background:#1b1f45;color:#fff;margin-top:10px}
.sheet .btn.ghost{background:transparent;color:var(--cardtext);border-color:#c9cde3}
.sheet .note{margin:8px 0;padding:10px 14px;border-radius:12px;background:#fff7dc;border:1.5px dashed #d8c78a;font-family:var(--hand);font-size:1.45rem;line-height:1.1}
.sheet .when{font-family:var(--mono);font-size:.74rem;color:var(--cardmute);margin:6px 0 0}

.foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:.72rem;color:var(--mute)}
.foot button{background:none;border:0;color:var(--mute);text-decoration:underline;padding:6px 2px;font-family:var(--mono);font-size:.72rem}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;color:#161a33;border-radius:999px;padding:10px 16px;font-weight:600;font-size:.92rem;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}

/* celebration */
.flash{position:fixed;inset:0;display:grid;place-items:center;z-index:50;pointer-events:none;text-align:center}
.flash div{animation:pop 2s ease forwards}
.flash b{display:block;font-family:var(--display);font-size:clamp(3.4rem,22vw,6.4rem);font-weight:800;line-height:.9;color:var(--lamp);text-shadow:0 6px 40px rgba(255,200,87,.6),0 2px 0 rgba(0,0,0,.4)}
.flash span{display:block;font-family:var(--hand);font-size:2rem;color:var(--c);margin-top:6px}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}18%{transform:scale(1.15) rotate(2deg);opacity:1}30%{transform:scale(1) rotate(0)}80%{opacity:1}100%{transform:scale(1.05);opacity:0}}
.finale{position:fixed;inset:0;z-index:30;background:rgba(5,8,20,.82);display:grid;place-items:center;padding:20px}
.finale .box{background:var(--card);color:var(--cardtext);border-radius:22px;padding:24px 20px;max-width:420px;width:100%;text-align:center}
.finale .route{margin:0 0 4px}
.finale .route .dot.a{left:36%} .finale .route .dot.b{right:36%} .finale .route .hrt{transform:translateX(-50%) scale(1.3);opacity:1;filter:drop-shadow(0 0 8px rgba(255,200,87,.8))}
.finale .route::before{border-top-color:#c9cde3}
.finale h2{font-size:2.2rem;font-weight:800;line-height:1;margin:6px 0 10px}
.finale h2 .x{font-family:var(--hand);color:#c58a00;font-weight:700}
.finale p{margin:0 0 8px;color:var(--cardmute)}
.finale .btn{background:#1b1f45;color:#fff;margin-top:10px}
.finale .btn.ghost{background:transparent;color:var(--cardtext);border-color:#c9cde3}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
.confetti i.h{width:14px;height:14px;border-radius:0;clip-path:path('M7 13C-3 7 -2 2 3 1c2-.6 3.5.4 4 2 .5-1.6 2-2.6 4-2 5 1 6 6-4 12z')}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){
  .sky,.cell.pend,.cell.line,.cell.slam,.cell.slam .pm,.sheet,.ask,.hero .route .dot,.hero .route .hrt,.flash div{animation:none}
  .journey .dot,.journey .hrt{transition:none} .confetti{display:none} .flash div{opacity:1}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="stripe"></div>
<div class="wrap">

  <!-- LOBBY -->
  <section id="lobby">
    <div class="hero">
      <div class="route" aria-hidden="true">
        <span class="dot a">K</span>
        <svg class="hrt" viewBox="0 0 64 64"><path d="M32 54C12 40 10 26 18 19c5-4.500 12-2.500 14 3 2-5.500 9-7.500 14-3 8 7 6 21-14 35z" fill="currentColor"/></svg>
        <span class="dot b">M</span>
      </div>
      <h1 class="mark"><span class="n-a">Khadi</span> <span class="x">×</span> <span class="n-b">Manny</span></h1>
      <p class="tag">Date night bingo</p>
    </div>
    <div class="who">
      <button class="whobtn a" type="button" data-slot="0"><span class="dot a">K</span><b>I&rsquo;m Khadi</b></button>
      <button class="whobtn b" type="button" data-slot="1"><span class="dot b">M</span><b>I&rsquo;m Manny</b></button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">
    <div class="top">
      <div class="wm"><span class="a">Khadi</span><i>×</i><span class="b">Manny</span></div>
      <div class="conn" id="conn"><i></i><span id="connt">Connecting</span></div>
    </div>

    <div class="journey" id="journey" aria-hidden="true">
      <span class="dot a">K</span>
      <svg class="hrt" viewBox="0 0 64 64"><path d="M32 54C12 40 10 26 18 19c5-4.500 12-2.500 14 3 2-5.500 9-7.500 14-3 8 7 6 21-14 35z" fill="currentColor"/></svg>
      <span class="dot b">M</span>
      <div class="cap" id="jcap"></div>
    </div>

    <div id="banner"></div>
    <div id="asks"></div>

    <div class="tabs" id="tabs"></div>
    <div class="letters" id="letters"></div>
    <div class="grid" id="grid"></div>

    <div class="foot">
      <span><button type="button" id="newcards">New cards</button></span>
      <span><button type="button" id="leave">Not you?</button></span>
    </div>
  </section>

</div>

<div id="sheetmount"></div>
<div id="finalemount"></div>
<div id="flashmount"></div>
<div class="confetti" id="confetti"></div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// LOGIC START
var POOL = [
  ['Dance break','Dance together on camera for one full song','Fun'],
  ['Silly filters','Spend five minutes on the silliest filters you can find','Fun'],
  ['Movie scene','Act out a movie scene together','Fun'],
  ['Quick portrait','Draw a portrait of them in under a minute','Fun'],
  ['Mirror game','Copy each other’s moves like a mirror for one minute','Fun'],

  ['Bad singing','Sing a line of their favorite song, badly','Fun'],
  ['Impression','Do an impression of them, to their face','Fun'],
  ['Hidden talent','Show them a talent they have never seen','Fun'],
  ['Quiz me','Make a five question quiz about yourself and quiz them','Fun'],
  ['New inside joke','Invent a brand new inside joke together','Fun'],

  ['Same sky','Look at the same sky together for five minutes','Fun'],
  ['Build a playlist','Add five songs together to a shared playlist','Fun'],
  ['Song swap','Play a song and explain why it made you think of them','Fun'],
  ['First memory','Tell them your earliest memory','Deep'],
  ['Kid photo','Show them a photo of you as a kid and tell the story','Deep'],
  ['A fear','Share a fear you have not told many people','Deep'],
  ['Say it','Say something you have been holding back','Deep'],
  ['Rate the day','Rate your day out of ten and defend the number','Deep'],
  ['Three wins','Name three small things that went right today','Deep'],
  ['Thank you','Tell them one thing you are thankful for about them','Deep'],
  ['Big compliment','Give them a compliment they will remember','Deep'],
  ['Tiny apology','Apologize for something small and silly from this month','Deep'],
  ['Fun fact','Teach them a fun fact they did not know','Deep'],
  ['Favorite word','Teach them a favorite word or phrase','Deep'],
  ['New word','Learn a word in a new language together','Deep'],
  ['Past bedtime','Stay up talking past your usual bedtime','Deep'],
  ['Read aloud','Read a page of a book out loud to them','Deep'],
  ['Read a letter','Write them a short letter and read it out loud','Deep'],
  ['Felt cared for','Tell them about a time you felt truly cared for','Deep'],
  ['Proud moment','Share something you are proud of and never bragged about','Deep'],
  ['Hard season','Share a hard season that shaped who you are','Deep'],
  ['Best advice','Share the best advice you ever received','Deep'],
  ['Who you admire','Tell them about someone you look up to and why','Deep'],
  ['Do over','Share something you would do differently if you could','Deep'],

function xmur3(str){
  var h = 1779033703 ^ str.length;
  for (var i = 0; i < str.length; i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function(){
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(arr, seedStr){
  var rnd = mulberry32(xmur3(seedStr)());
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
// Two disjoint cards of 24 squares each, laid out 5x5 with a free square in the middle (cell 12). Cell value is a POOL index, or -1 for free.
function buildCards(seed){
  // Each card gets a balanced mix: 9 fun, 8 get-to-know-you, 3 dreams, 4 faith. The two cards never share a square.
  var QUOTA = {Fun: 9, Deep: 8, Dreams: 3, Faith: 4};
  var picks = [[], []];
  Object.keys(QUOTA).forEach(function(cat){
    var ids = [];
    POOL.forEach(function(q, i){ if (q[2] === cat) ids.push(i); });
    var order = shuffled(ids, seed + ':' + cat), n = QUOTA[cat];
    picks[0] = picks[0].concat(order.slice(0, n));
    picks[1] = picks[1].concat(order.slice(n, n * 2));
  });
  var cards = [];
  for (var p = 0; p < 2; p++){
    var laid = shuffled(picks[p], seed + ':layout' + p);
    var cells = [], k = 0;
    for (var c = 0; c < 25; c++) cells.push(c === 12 ? -1 : laid[k++]);
    cards.push(cells);
  }
  return cards;
}
var LINES = (function(){
  var L = [], i, j;
  for (i = 0; i < 5; i++){
    var r = [], c = [];
    for (j = 0; j < 5; j++){ r.push(i * 5 + j); c.push(j * 5 + i); }
    L.push(r, c);
  }
  L.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
  return L;
})();
function doneLines(stampedSet){
  return LINES.filter(function(line){
    return line.every(function(c){ return c === 12 || stampedSet.has(c); });
  });
}
// Everything about the game is derived from the ordered event list, so both phones always agree.
function reduce(events, baseSeed){
  var seed = baseSeed;
  var stamped = [new Set(), new Set()], notes = [{}, {}], dates = [{}, {}], pending = {}, bingoSeq = [null, null];
  var list = events.slice().sort(function(a, b){ return a.seq - b.seq; });
  list.forEach(function(ev){
    var pl = ev.payload || {};
    if (ev.kind === 'newgame'){
      stamped = [new Set(), new Set()]; notes = [{}, {}]; dates = [{}, {}]; pending = {}; bingoSeq = [null, null];
      if (pl.seed) seed = String(pl.seed);
      return;
    }
    if (ev.kind === 'claim'){
      var p = ev.player, sq = pl.sq;
      if (typeof sq !== 'number' || sq < 0 || sq > 24 || sq === 12) return;
      if (stamped[p].has(sq)) return;
      for (var k in pending) if (pending[k].p === p && pending[k].sq === sq) return;
      pending[ev.seq] = {seq: ev.seq, p: p, sq: sq, note: String(pl.note || '').slice(0, 200)};
    } else if (ev.kind === 'resolve'){
      var c = pending[pl.claim];
      if (!c || ev.player !== 1 - c.p) return;
      delete pending[pl.claim];
      if (pl.ok){
        stamped[c.p].add(c.sq); notes[c.p][c.sq] = c.note; dates[c.p][c.sq] = ev.created_at || null;
        if (bingoSeq[c.p] === null && doneLines(stamped[c.p]).length) bingoSeq[c.p] = ev.seq;
      }
    } else if (ev.kind === 'withdraw'){
      var w = pending[pl.claim];
      if (!w || ev.player !== w.p) return;
      delete pending[pl.claim];
    }
  });
  var phase = 'play', first = null;
  if (bingoSeq[0] !== null || bingoSeq[1] !== null){
    phase = (bingoSeq[0] !== null && bingoSeq[1] !== null) ? 'double' : 'first';
    first = bingoSeq[0] === null ? 1 : (bingoSeq[1] === null ? 0 : (bingoSeq[0] < bingoSeq[1] ? 0 : 1));
  }
  return {seed: seed, stamped: stamped, notes: notes, dates: dates, pending: pending, bingoSeq: bingoSeq, phase: phase, first: first};
}

  }

  /* ---------- boot ---------- */
  (async function boot(){
    if (!cfg || !window.supabase){
      lobbyErr('The game could not load its connection. Refresh the page.');
      document.querySelectorAll('.whobtn').forEach(function(b){ b.disabled = true; });
      return;
    }
    sb = window.supabase.createClient(cfg.url, cfg.key);
    var saved = loadSession();
    if (saved && (saved.slot === 0 || saved.slot === 1)){
      try {
        var res = await sb.from('rooms').select('*').eq('code', ROOM).maybeSingle();
        if (res.data){ await enterRoom(res.data, saved.slot); return; }
      } catch(e){}
      clearSession();
    }
  })();
})();
</script>
</body>
</html>
